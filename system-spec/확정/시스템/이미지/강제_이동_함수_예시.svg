<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">대각선 밀쳐짐과 당겨짐의 강제 이동 함수 예시</title>
  <desc id="desc">대각선으로 배치된 시전자 S와 대상 T를 잇는 방향 벡터로 밀쳐짐과 당겨짐 경로를 계산하고, 당겨짐이 시전자 셀과 겹치기 전에 이동 거리를 보정하는 예시다.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.grid{fill:none;stroke:#cbd5e1;stroke-width:1}.title{font:700 28px sans-serif;fill:#0f172a}.head{font:700 22px sans-serif;fill:#0f172a}.body{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#475569}.celltext{font:700 14px sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.source{fill:#93c5fd;stroke:#2563eb;stroke-width:3}.target{fill:#fdba74;stroke:#ea580c;stroke-width:3}.step{fill:#bbf7d0;stroke:#16a34a;stroke-width:2}.blocked{fill:none;stroke:#7c3aed;stroke-width:4}.pushline{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow-blue)}.pullline{fill:none;stroke:#ea580c;stroke-width:4;marker-end:url(#arrow-orange)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6}.note{fill:#f3e8ff;stroke:#a855f7;stroke-width:1.5}.point{fill:#16a34a;stroke:#fff;stroke-width:2}
      @media (prefers-color-scheme:dark){.bg{fill:#0f172a}.panel{fill:#111827;stroke:#475569}.grid{stroke:#475569}.title,.head,.celltext{fill:#f8fafc}.body,.small{fill:#cbd5e1}.note{fill:#2e1065;stroke:#a855f7}.point{stroke:#111827}}
    </style>
  </defs>
  <rect class="bg" width="1000" height="680"/>
  <text class="title" x="40" y="48">대각선 강제 이동 함수 예시</text>
  <text class="body" x="40" y="78">S=(1,1), T=(4,3), D=(3/√13, 2/√13) · 셀 한 변 길이 × n만큼 직선 이동</text>

  <g transform="translate(30 105)">
    <rect class="panel" width="455" height="535" rx="14"/>
    <text class="head" x="24" y="38">밀쳐짐</text>
    <text class="body" x="24" y="66">F(k)=T+D×(1×k) · 밀쳐짐 n=3</text>
    <g transform="translate(35 94)">
      <path class="grid" d="M0 0H384M0 48H384M0 96H384M0 144H384M0 192H384M0 240H384M0 288H384M0 0V288M48 0V288M96 0V288M144 0V288M192 0V288M240 0V288M288 0V288M336 0V288M384 0V288"/>
      <text class="small" x="24" y="310" text-anchor="middle">0</text><text class="small" x="72" y="310" text-anchor="middle">1</text><text class="small" x="120" y="310" text-anchor="middle">2</text><text class="small" x="168" y="310" text-anchor="middle">3</text><text class="small" x="216" y="310" text-anchor="middle">4</text><text class="small" x="264" y="310" text-anchor="middle">5</text><text class="small" x="312" y="310" text-anchor="middle">6</text><text class="small" x="360" y="310" text-anchor="middle">7</text>
      <path class="dash" d="M72 216L216 120"/>
      <rect class="source" x="50" y="194" width="44" height="44" rx="7"/><text class="celltext" x="72" y="216">S</text>
      <rect class="target" x="194" y="98" width="44" height="44" rx="7"/><text class="celltext" x="216" y="120">T</text>
      <rect class="step" x="242" y="50" width="44" height="44" rx="7"/><text class="celltext" x="264" y="72">C1</text>
      <rect class="step" x="290" y="50" width="44" height="44" rx="7"/><text class="celltext" x="312" y="72">C2</text>
      <rect class="step" x="290" y="2" width="44" height="44" rx="7"/><text class="celltext" x="312" y="24">C3</text>
      <path class="pushline" d="M216 120L255.9 93.4L295.9 66.7L335.8 40.1"/>
      <circle class="point" cx="255.9" cy="93.4" r="5"/><circle class="point" cx="295.9" cy="66.7" r="5"/><circle class="point" cx="335.8" cy="40.1" r="5"/>
    </g>
    <text class="body" x="24" y="458">대상은 직선의 대각선 방향을 유지하며 3칸 이동</text>
    <text class="small" x="24" y="486">단계 셀: C1=(5,4) → C2=(6,4) → C3=(6,5)</text>
    <text class="small" x="24" y="512">최종 목적지: C(3)=(6,5)</text>
  </g>

  <g transform="translate(515 105)">
    <rect class="panel" width="455" height="535" rx="14"/>
    <text class="head" x="24" y="38">당겨짐</text>
    <text class="body" x="24" y="66">F(k)=T−D×(1×k) · 당겨짐 n=4</text>
    <g transform="translate(35 94)">
      <path class="grid" d="M0 0H384M0 48H384M0 96H384M0 144H384M0 192H384M0 240H384M0 288H384M0 0V288M48 0V288M96 0V288M144 0V288M192 0V288M240 0V288M288 0V288M336 0V288M384 0V288"/>
      <text class="small" x="24" y="310" text-anchor="middle">0</text><text class="small" x="72" y="310" text-anchor="middle">1</text><text class="small" x="120" y="310" text-anchor="middle">2</text><text class="small" x="168" y="310" text-anchor="middle">3</text><text class="small" x="216" y="310" text-anchor="middle">4</text><text class="small" x="264" y="310" text-anchor="middle">5</text><text class="small" x="312" y="310" text-anchor="middle">6</text><text class="small" x="360" y="310" text-anchor="middle">7</text>
      <path class="dash" d="M72 216L216 120"/>
      <rect class="source" x="50" y="194" width="44" height="44" rx="7"/><circle class="blocked" cx="72" cy="216" r="31"/><text class="celltext" x="72" y="216">S</text>
      <rect class="step" x="98" y="194" width="44" height="44" rx="7"/><text class="celltext" x="120" y="216">C3</text>
      <rect class="step" x="98" y="146" width="44" height="44" rx="7"/><text class="celltext" x="120" y="168">C2</text>
      <rect class="step" x="146" y="146" width="44" height="44" rx="7"/><text class="celltext" x="168" y="168">C1</text>
      <rect class="target" x="194" y="98" width="44" height="44" rx="7"/><text class="celltext" x="216" y="120">T</text>
      <path class="pullline" d="M216 120L176.1 146.6L136.1 173.3L96.2 199.9"/>
      <circle class="point" cx="176.1" cy="146.6" r="5"/><circle class="point" cx="136.1" cy="173.3" r="5"/><circle class="point" cx="96.2" cy="199.9" r="5"/>
      <rect class="note" x="6" y="246" width="245" height="58" rx="8"/>
      <text class="small" x="18" y="270">C(4)=(1,1)=시전자 셀 → 제외</text>
      <text class="small" x="18" y="293">n_effective=4−1=3</text>
    </g>
    <text class="body" x="24" y="458">대상은 C(3)에서 정지 · 시전자와 충돌 없음</text>
    <text class="small" x="24" y="486">단계 셀: C1=(3,2) → C2=(2,2) → C3=(2,1)</text>
    <text class="small" x="24" y="512">충돌 판정과 양쪽의 충돌 피해 모두 발생하지 않음</text>
  </g>
</svg>
