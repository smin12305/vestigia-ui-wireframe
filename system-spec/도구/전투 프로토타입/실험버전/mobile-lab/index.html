<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10171b"><title>WAREDO · 시간의 전장</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game" data-time="현재">
 <header class="topbar"><div class="operation"><b>WAREDO<span>TACTICAL OPERATIONS</span></b><small>01—03 / 잊힌 관측소</small></div><nav id="order" aria-label="행동 순서"></nav><div class="system"><button id="speed" aria-label="실행 속도 변경">1×</button><button id="pause" aria-label="일시정지">Ⅱ</button></div></header>
 <aside class="left-rail"><section class="time-panel"><div class="eyebrow">CHRONO ENGINE</div><div class="clock-row"><div class="watch" id="watch"><div><span id="shards">0</span><small>/ 100</small></div></div><div><strong id="period">현재</strong><small id="stay">파편 충전 중</small></div></div><div class="time-actions"><button id="past">과거 <span>이동 +1</span></button><button id="future">미래 <span>공격 +3</span></button></div><p id="timehint">현재 시간대에서 파편을 모으세요</p></section><section class="party" id="party" aria-label="아군 선택"></section><button class="quiet" id="help">? 조작 안내</button></aside>
 <section class="battlefield"><div class="field-heading"><span><b id="turn">TURN 01</b> <small id="phase">행동 설계</small></span><span id="objective">적 전원 격파</span></div><div id="board" role="group" aria-label="6 곱하기 6 전투판"></div><div class="field-footer"><span id="hint" aria-live="polite">아군을 선택해 행동을 설계하세요</span><button id="threat">적 예고</button></div></section>
 <aside class="right-rail"><section class="unit-detail"><div class="eyebrow" id="unitRole">OPERATOR / PAST</div><h1 id="unitName">아이작</h1><div class="stats" id="stats"></div><div class="reorder"><span>행동 순서</span><button id="earlier" aria-label="아군 순서 앞으로">←</button><button id="later" aria-label="아군 순서 뒤로">→</button></div></section><div class="commands"><button id="move" class="command"><span class="symbol">↗</span><span>이동<small id="moveMeta">3칸</small></span></button><button id="attack" class="command"><span class="symbol">╱</span><span>일반 공격<small id="attackMeta">직선 1칸</small></span></button><button id="skill" class="command"><span class="symbol">✦</span><span id="skillLabel">지진<small>자기 중심 3×3</small></span></button></div><div class="plan-review"><span id="planText">행동 미설정</span><div><button id="cancel">취소</button><button id="confirm">행동 확정</button></div></div><button id="execute"><span>계획 실행 <b>▶</b></span><small id="ready">미설정 캐릭터는 대기</small></button></aside>
 <footer class="battle-log"><span class="live-dot"></span><span id="latest">전투 개시. 적의 행동 예고를 확인하세요.</span><button id="log">기록</button></footer>
 <div id="floats" aria-hidden="true"></div>
 <dialog id="modal"><div class="modal-top"><span>WAREDO / OPERATIONS</span><button id="close" aria-label="닫기">×</button></div><div id="modalContent"></div></dialog>
</main><script src="model.js"></script><script src="app.js"></script></body></html>
